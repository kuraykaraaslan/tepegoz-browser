      The actionable control lives inside a SAME-ORIGIN iframe. Render-DOM perception (AI-2 PR2b)
      recurses into the iframe's document (one index space) and addresses the link by a path that
      crosses the frame boundary. The link uses target="_top", so clicking it navigates the top page.
    -->
    <iframe src="frame.html" title="Navigation panel"></iframe>
    <p>Use the panel above to continue.</p>
