<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- CSP is set via session response headers in main (security.ts installSecurity) — dev-relaxed
         for Vite HMR / React-Refresh inline preamble, strict in prod. A static meta CSP breaks dev. -->
    <title>Tepegöz</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* Track the active theme's surface once tokens load / main.tsx applies the theme (popups pass it
           in the URL). Falls back to brand navy for the very first paint before the bundle runs — the
           native window backgroundColor is already the resolved surface color, so there's no flash. */
        background: var(--surface-base, #0c2135);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
