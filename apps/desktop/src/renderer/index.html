<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- CSP is set via session response headers in main (security.ts installSecurity) — dev-relaxed
         for Vite HMR / React-Refresh inline preamble, strict in prod. A static meta CSP breaks dev. -->
    <title>Tepegöz</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* Deliberately paints NOTHING. Every surface in this bundle draws its own ground (`.app-shell`,
           each popup root, each tepegoz:// page), and until React mounts, the ground that should show is
           the one the MAIN process already resolved from the active theme and set as the native
           backgroundColor of the window / WebContentsView (see lib/surface-theme.ts).

           This used to be `var(--surface-base, #0c2135)`, and that fallback is exactly the menu flash:
           the document paints before tokens.css and main.tsx have run, so the var is still unset and the
           popup came up brand navy over a purple theme before snapping to the real colour. Painting
           nothing here lets the correct colour — already under the document — show the whole time.
           It is also what lets Mica through on the glass chrome: an opaque root canvas would cover the
           backdrop no matter how transparent `.app-shell` is. */
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
