# electron-builder config for Tepegöz — Windows (NSIS), macOS (dmg/zip), Linux (deb/rpm/tar.gz).
#
# The app is built by electron-vite into `out/` (main/preload/renderer); electron-builder only
# PACKAGES that output into an installer — it does not compile TS. Run via the per-OS scripts
# (`pnpm package:win` / `package:mac` / `package:linux`), each of which runs `electron-vite build`
# first; never invoke electron-builder alone.
#
# Native modules (better-sqlite3) and OS installers CANNOT be cross-compiled — build each platform on
# its own machine/runner: Windows→windows-latest, macOS→macos-latest, Linux→ubuntu-latest.
# See .github/workflows/release.yml.
appId: com.tepegoz.browser
productName: Tepegöz

# pnpm's hoisted linker installs electron at the monorepo-root node_modules, not apps/desktop's, so
# electron-builder can't auto-detect it from projectDir — pin the version explicitly.
#
# This MUST match the resolved `electron` devDependency, and nothing used to check: the dependency was
# bumped while this line still said 33.4.11, so the packager would have shipped an installer built
# against a different Electron than the one the app was developed and tested on. `electron-version.test.ts`
# now fails when the two drift.
electronVersion: 43.4.1

directories:
  # Installer + unpacked output → apps/desktop/dist/ (git-ignored). This is ~1 GB (win-unpacked +
  # installer) and is DELIBERATELY NOT a turbo cache output — `@tepegoz/desktop#build` in turbo.json
  # caches only `out/**`. Do not add `dist/**` back to that task's `outputs`.
  # buildResources is where electron-builder looks for installer assets.
  output: dist
  buildResources: resources

# What goes INTO the app (app.asar). Workspace packages are bundled into out/ by electron-vite (and
# are devDependencies, so electron-builder never collects their outside-appDir pnpm symlinks), so only
# the built output + resources + package.json are needed. `resources/**` MUST be included: the brand
# icon is loaded at runtime via `join(app.getAppPath(), 'resources', 'icon.ico')` (src/main/window.ts)
# — app.getAppPath() resolves to app.asar, so resources ship inside it.
files:
  - out/**
  - resources/**
  - package.json

# better-sqlite3 is a native addon; a .node binary cannot be loaded from inside an asar archive, so
# unpack it to app.asar.unpacked/. Without this, the DB fails to open and history/journal silently
# no-op (see src/main/db/database.electron.ts).
asarUnpack:
  - '**/*.node'

# Rebuild native deps during packaging. The database is `node:sqlite` (in-runtime, nothing to rebuild);
# this stays on for node-llama-cpp, whose prebuilds are N-API and therefore ABI-independent.
npmRebuild: true

# ── Electron fuses (Phase 0 DoD) ───────────────────────────────────────────────────────────────────
# Fuses are flipped in the packaged binary itself, so they are the only layer that still holds when an
# attacker controls the command line or the environment — `webPreferences` cannot help there. Every one
# below is OFF-by-default-dangerous, and this project's own threat model already assumes the renderer is
# hostile.
electronFuses:
  # ELECTRON_RUN_AS_NODE turns the shipped browser into a general-purpose Node interpreter running with
  # the app's identity. Nothing here relies on it: the repo strips the variable in twelve places
  # (dev launcher, eval harness, every e2e spec) precisely because it is a footgun. Closing the fuse
  # deletes the footgun instead of routing around it.
  runAsNode: false
  # Cookies at rest are encrypted with the OS keychain rather than stored in the clear.
  enableCookieEncryption: true
  # NODE_OPTIONS and --inspect are code-injection channels into the main process. A browser must not
  # accept either from whoever can set an env var or write a shortcut.
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # Verify the asar's integrity header before executing anything from it, and refuse to look anywhere
  # else for app code. The pair is what makes tampering with the installed app fail closed rather than
  # silently succeed; `onlyLoadAppFromAsar` alone would still run an unvalidated asar.
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # LEFT OPEN, deliberately, and this is the one to revisit.
  #
  # The chrome is loaded with `loadFile()`, so it lives at `file://…/app.asar/out/renderer/index.html`,
  # and resolving a path INSIDE an asar over file:// is one of the privileges this fuse grants. Closing
  # it produces a packaged app that boots, opens its window, and renders nothing — observed, not feared.
  #
  # Serving the chrome from a custom `app://` scheme fixes that and was built and verified end to end
  # (packaged, fuse closed, CDP showing the chrome live at app://chrome/index.html). It was reverted
  # because Playwright's Electron support does not surface windows on non-standard schemes:
  # `firstWindow()` never resolves, and the whole e2e suite goes blind. Trading a working e2e gate — a
  # DoD item in its own right — for one fuse is a bad trade.
  #
  # The exposure this fuse covers was addressed at the other end instead: `isTrustedAppUrl` no longer
  # trusts the file:// SCHEME, it matches the chrome's exact document URL (`chrome-url.ts`).
  # Revisit when Playwright learns custom schemes, or when the e2e suite drives Electron over raw CDP.
  grantFileProtocolExtraPrivileges: true

win:
  target: nsis
  icon: resources/icon.ico
  # --- Code signing (BLOCKING for distribution; not configured yet → unsigned dev-only builds) ---
  # Unsigned installers trigger a SmartScreen "Unknown publisher" warning. When a signing identity is
  # available, enable ONE of the following (driven by env/secrets, never commit certs/keys):
  #   Authenticode (.pfx):  set CSC_LINK + CSC_KEY_PASSWORD env vars (electron-builder picks them up).
  #   Azure Trusted Signing:
  #     azureSignOptions:
  #       endpoint: https://<region>.codesigning.azure.net
  #       certificateProfileName: <profile>
  #       codeSigningAccountName: <account>

nsis:
  oneClick: false # show a wizard instead of silent install
  perMachine: false # per-user install → no admin/UAC prompt
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Tepegöz
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico

mac:
  target:
    - dmg # drag-to-Applications disk image
    - zip # plain archive (also the update artifact if electron-updater is added later)
  icon: resources/icon.png # electron-builder converts PNG (≥512) → icon.icns at build time
  category: public.app-category.productivity
  # --- Signing + notarization (BLOCKING for distribution; unset → unsigned dev-only builds) ---
  # Gatekeeper blocks unsigned/un-notarized apps. When an Apple Developer ID is available:
  #   hardenedRuntime: true
  #   notarize: true            # requires APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID env
  # and provide the signing cert via CSC_LINK / CSC_KEY_PASSWORD.

dmg: {} # defaults are fine (app + Applications symlink)

linux:
  target:
    - deb # Debian / Ubuntu
    - rpm # Fedora / RHEL (needs the `rpm` tool on the build host — see release.yml)
    - tar.gz # distro-agnostic archive
  icon: resources/icon.png # ≥512 PNG; electron-builder generates the hicolor icon set
  category: Network # freedesktop main category for a web browser
  maintainer: Kuray Karaaslan <kuraykaraaslan@gmail.com>
  synopsis: Agentic, security-by-design, local-first browser.

# publish: (electron-updater feed) intentionally omitted — auto-update is a separate follow-up.
