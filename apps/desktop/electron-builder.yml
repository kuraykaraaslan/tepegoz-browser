# electron-builder config for Tepegöz — Windows (NSIS), macOS (dmg/zip), Linux (deb/rpm/tar.gz).
#
# The app is built by electron-vite into `out/` (main/preload/renderer); electron-builder only
# PACKAGES that output into an installer — it does not compile TS. Run via the per-OS scripts
# (`pnpm package:win` / `package:mac` / `package:linux`), each of which runs `electron-vite build`
# first; never invoke electron-builder alone.
#
# Native modules (better-sqlite3) and OS installers CANNOT be cross-compiled — build each platform on
# its own machine/runner: Windows→windows-latest, macOS→macos-latest, Linux→ubuntu-latest.
# See .github/workflows/release.yml.
appId: com.tepegoz.browser
productName: Tepegöz

# pnpm's hoisted linker installs electron at the monorepo-root node_modules, not apps/desktop's, so
# electron-builder can't auto-detect it from projectDir — pin the version explicitly. Keep this in
# sync with the `electron` devDependency (currently ^33.2.1 → resolved 33.4.11).
electronVersion: 33.4.11

directories:
  # Installer + unpacked output → apps/desktop/dist/ (turbo `build` already lists dist/** as output;
  # dist/ is git-ignored). buildResources is where electron-builder looks for installer assets.
  output: dist
  buildResources: resources

# What goes INTO the app (app.asar). Workspace packages are bundled into out/ by electron-vite (and
# are devDependencies, so electron-builder never collects their outside-appDir pnpm symlinks), so only
# the built output + resources + package.json are needed. `resources/**` MUST be included: the brand
# icon is loaded at runtime via `join(app.getAppPath(), 'resources', 'icon.ico')` (src/main/window.ts)
# — app.getAppPath() resolves to app.asar, so resources ship inside it.
files:
  - out/**
  - resources/**
  - package.json

# better-sqlite3 is a native addon; a .node binary cannot be loaded from inside an asar archive, so
# unpack it to app.asar.unpacked/. Without this, the DB fails to open and history/journal silently
# no-op (see src/main/db/database.electron.ts).
asarUnpack:
  - '**/*.node'

# Rebuild native deps (better-sqlite3) against the Electron ABI during packaging.
npmRebuild: true

win:
  target: nsis
  icon: resources/icon.ico
  # --- Code signing (BLOCKING for distribution; not configured yet → unsigned dev-only builds) ---
  # Unsigned installers trigger a SmartScreen "Unknown publisher" warning. When a signing identity is
  # available, enable ONE of the following (driven by env/secrets, never commit certs/keys):
  #   Authenticode (.pfx):  set CSC_LINK + CSC_KEY_PASSWORD env vars (electron-builder picks them up).
  #   Azure Trusted Signing:
  #     azureSignOptions:
  #       endpoint: https://<region>.codesigning.azure.net
  #       certificateProfileName: <profile>
  #       codeSigningAccountName: <account>

nsis:
  oneClick: false # show a wizard instead of silent install
  perMachine: false # per-user install → no admin/UAC prompt
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Tepegöz
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico

mac:
  target:
    - dmg # drag-to-Applications disk image
    - zip # plain archive (also the update artifact if electron-updater is added later)
  icon: resources/icon.png # electron-builder converts PNG (≥512) → icon.icns at build time
  category: public.app-category.productivity
  # --- Signing + notarization (BLOCKING for distribution; unset → unsigned dev-only builds) ---
  # Gatekeeper blocks unsigned/un-notarized apps. When an Apple Developer ID is available:
  #   hardenedRuntime: true
  #   notarize: true            # requires APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID env
  # and provide the signing cert via CSC_LINK / CSC_KEY_PASSWORD.

dmg: {} # defaults are fine (app + Applications symlink)

linux:
  target:
    - deb # Debian / Ubuntu
    - rpm # Fedora / RHEL (needs the `rpm` tool on the build host — see release.yml)
    - tar.gz # distro-agnostic archive
  icon: resources/icon.png # ≥512 PNG; electron-builder generates the hicolor icon set
  category: Network # freedesktop main category for a web browser
  maintainer: Kuray Karaaslan <kuraykaraaslan@gmail.com>
  synopsis: Agentic, security-by-design, local-first browser.

# publish: (electron-updater feed) intentionally omitted — auto-update is a separate follow-up.
