name: Release

# Tag-driven, per-OS matrix. OS installers cannot be
# cross-compiled, so each OS builds on its own runner.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # attach installers to the GitHub Release for this tag

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Validate release tag
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Validate desktop app
        run: |
          pnpm --filter @tepegoz/desktop run typecheck
          pnpm --filter @tepegoz/desktop run lint
          pnpm --filter @tepegoz/desktop run build

      # Package the per-OS installers. Each `package:*` script runs `electron-vite build` first, then
      # electron-builder. The database is `node:sqlite` (in-runtime, nothing to rebuild); `npmRebuild`
      # stays on for node-llama-cpp, whose prebuilds are N-API and therefore ABI-independent.
      # NOTE: all builds are UNSIGNED (dev-only). Code signing is still BLOCKING for public
      # distribution — wire the signing secrets in apps/desktop/electron-builder.yml once identities
      # exist: Windows Authenticode (CSC_LINK/CSC_KEY_PASSWORD) or Azure Trusted Signing; macOS
      # Developer ID + notarize (APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID). electron-updater
      # publishing remains a follow-up (not built here yet).
      - name: Package Windows installer (NSIS .exe)
        if: matrix.os == 'windows-latest'
        run: pnpm --filter @tepegoz/desktop run package:win
      - name: Verify Windows installer
        if: matrix.os == 'windows-latest'
        shell: bash
        run: test -n "$(find apps/desktop/dist -name '*.exe' -print -quit)"

      - name: Package macOS (.dmg + .zip)
        if: matrix.os == 'macos-latest'
        run: pnpm --filter @tepegoz/desktop run package:mac

      - name: Package Linux (.deb + .tar.gz)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @tepegoz/desktop run package:linux
      - name: Verify Debian package
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: test -n "$(find apps/desktop/dist -name '*.deb' -print -quit)"
      - name: Verify macOS artifacts
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          test -n "$(find apps/desktop/dist -name '*.dmg' -print -quit)"
          test -n "$(find apps/desktop/dist -name '*.zip' -print -quit)"

      # One artifact per OS (unique name required). Each runner only produces its own formats, so the
      # globs that don't match are ignored.
      - name: Upload installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: tepegoz-${{ matrix.os }}
          path: |
            apps/desktop/dist/**/Tepegoz-*.exe
            apps/desktop/dist/**/*.dmg
            apps/desktop/dist/**/*.zip
            apps/desktop/dist/**/*.deb
            apps/desktop/dist/**/*.tar.gz
          if-no-files-found: ignore

      - name: Create platform checksums
        shell: bash
        run: |
          find apps/desktop/dist -type f \( -name 'Tepegoz-*.exe' -o -name '*.deb' -o -name '*.dmg' -o -name '*.zip' -o -name '*.tar.gz' \) -print0 \
            | xargs -0 sha256sum \
            > "apps/desktop/dist/SHA256SUMS-${{ matrix.os }}"

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/dist/**/Tepegoz-*.exe
            apps/desktop/dist/**/*.dmg
            apps/desktop/dist/**/*.zip
            apps/desktop/dist/**/*.deb
            apps/desktop/dist/**/*.tar.gz
            apps/desktop/dist/SHA256SUMS-${{ matrix.os }}
          body: |
            ## Tepegöz Browser ${{ github.ref_name }}

            This release contains native desktop installers built on their
            target operating systems.

            ### Windows

            - Windows installer: `Tepegoz-${{ github.ref_name }}-win-*.exe`
            - Per-user installation; no administrator prompt is required by default.

            ### Debian/Ubuntu

            - Debian package: `Tepegoz-${{ github.ref_name }}-linux-x64.deb`
            - Install with `sudo apt install ./<file>.deb`.

            macOS publishes matching `Tepegoz-${{ github.ref_name }}-mac-*.dmg`
            and `.zip` artifacts. Each platform also publishes a SHA-256
            checksum file. The Windows installer is currently unsigned;
            SmartScreen may display an “unknown publisher” warning until an
            Authenticode certificate is configured via repository secrets.
